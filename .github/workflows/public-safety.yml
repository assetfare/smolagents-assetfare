name: Public safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install reviewed Space dependency range and test tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -r hub_bundles/assetfare-quote/requirements.txt pytest ruff pip-audit
          python -m pytest tests/ -q
          ruff check .
          pip-audit
