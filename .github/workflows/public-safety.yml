name: Public safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install reviewed Space dependency range and test tools
        run: |
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -r hub_bundles/assetfare-quote/requirements.txt pytest ruff pip-audit
          python -m pytest tests/ -q
          ruff check .
          pip-audit
